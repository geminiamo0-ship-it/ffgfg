name: Inspect NBME 34 DB

on:
  push:
    branches: [main]
    paths:
      - 'my_course_bank.db'
      - '.github/workflows/inspect-nbme34-db.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect SQLite database
        shell: bash
        run: |
          python3 - <<'PY'
          import sqlite3, subprocess
          from pathlib import Path

          db = Path('my_course_bank.db')
          con = sqlite3.connect(db)
          con.row_factory = sqlite3.Row
          cur = con.cursor()

          integrity = cur.execute('PRAGMA integrity_check').fetchall()
          tables = [r[0] for r in cur.execute("SELECT name FROM sqlite_master WHERE type='table' ORDER BY name")]

          def cols(table):
              return [r[1] for r in cur.execute(f'PRAGMA table_info({table})').fetchall()]

          qcols = cols('questions') if 'questions' in tables else []
          ocols = cols('options') if 'options' in tables else []
          qcount = cur.execute('SELECT COUNT(*) FROM questions').fetchone()[0] if 'questions' in tables else None
          ocount = cur.execute('SELECT COUNT(*) FROM options').fetchone()[0] if 'options' in tables else None

          def scalar(sql):
              try:
                  return cur.execute(sql).fetchone()[0]
              except Exception as e:
                  return f'ERROR: {e}'

          max_qid = scalar('SELECT MAX(id) FROM questions') if 'id' in qcols else 'N/A'
          max_uwid = scalar('SELECT MAX(uworld_id) FROM questions') if 'uworld_id' in qcols else 'N/A'
          max_oid = scalar('SELECT MAX(id) FROM options') if 'id' in ocols else 'N/A'

          wanted = [c for c in ['id','uworld_id','subject','system','topic','source','created_at'] if c in qcols]
          latest = []
          if wanted:
              order = 'id' if 'id' in qcols else wanted[0]
              latest = cur.execute(f"SELECT {', '.join(wanted)} FROM questions ORDER BY {order} DESC LIMIT 10").fetchall()

          commit = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          lines = ['# NBME 34 Database Status','',f'Generated from commit: `{commit}`','',
                   '## SQLite integrity','```text', *[str(r[0]) for r in integrity], '```','',
                   '## Tables','```text', '  '.join(tables), '```','',
                   '## Counts','', f'- Questions: {qcount}', f'- Options: {ocount}','',
                   '## Latest IDs','', f'- Max question id: {max_qid}', f'- Max uworld_id: {max_uwid}', f'- Max option id: {max_oid}','',
                   '## Latest question rows','```text']
          if latest:
              widths = {c:max(len(c), *(len(str(r[c] if r[c] is not None else '')) for r in latest)) for c in wanted}
              lines.append('  '.join(c.ljust(widths[c]) for c in wanted))
              lines.append('  '.join('-'*widths[c] for c in wanted))
              for r in latest:
                  lines.append('  '.join(str(r[c] if r[c] is not None else '').ljust(widths[c]) for c in wanted))
          else:
              lines.append('(none)')
          lines += ['```','','## Question columns','```text']
          for r in cur.execute('PRAGMA table_info(questions)').fetchall():
              lines.append(' | '.join(str(x) for x in r))
          lines += ['```','','## Option columns','```text']
          for r in cur.execute('PRAGMA table_info(options)').fetchall():
              lines.append(' | '.join(str(x) for x in r))
          lines += ['```','']
          Path('DB_STATUS.md').write_text('\n'.join(lines), encoding='utf-8')
          con.close()
          PY
      - name: Commit status report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DB_STATUS.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record NBME 34 database status"
          git push
