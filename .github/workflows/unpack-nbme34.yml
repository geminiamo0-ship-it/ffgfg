name: Unpack NBME 34

on:
  push:
    branches: [main]
    paths:
      - '.upload/READY'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild uploaded archive
        shell: bash
        run: |
          cat .upload/part_* > /tmp/NBME_34.rar.b64
          base64 -d /tmp/NBME_34.rar.b64 > /tmp/NBME_34.rar
          7z x /tmp/NBME_34.rar -o. -y
          test -f my_course_bank.db
          test -d offline_media
      - name: Commit extracted database and media
        shell: bash
        run: |
          rm -rf .upload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract NBME 34 database and offline media"
          git push
