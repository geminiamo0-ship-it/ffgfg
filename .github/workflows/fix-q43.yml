name: Fix NBME Question 43

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-q43.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix question 43 image link and exact wording
        shell: bash
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path

          con = sqlite3.connect('my_course_bank.db')
          cur = con.cursor()
          cur.execute('BEGIN IMMEDIATE')

          row = cur.execute(
              'SELECT text_html, explanation_html FROM questions WHERE id=43 AND uworld_id=43'
          ).fetchone()
          if row is None:
              raise RuntimeError('Question 43 not found')

          text_html, explanation_html = row

          old_img = 'offline_media/43_stem_img_0.jpg'
          new_img = 'offline_media/43_stem_img_0.webp'
          if old_img not in text_html and new_img not in text_html:
              raise RuntimeError('Question 43 image link is not in the expected state')
          text_html = text_html.replace(old_img, new_img)

          old_phrase = 'as much as it is aortic root dilation or aortitis.'
          new_phrase = 'as much as its aortic root dilation or aortitis.'
          if old_phrase in explanation_html:
              explanation_html = explanation_html.replace(old_phrase, new_phrase)
          elif new_phrase not in explanation_html:
              raise RuntimeError('Question 43 wording is not in the expected state')

          cur.execute(
              'UPDATE questions SET text_html=?, explanation_html=? WHERE id=43',
              (text_html, explanation_html)
          )

          opts = cur.execute(
              'SELECT text_html, is_correct, option_order FROM options WHERE question_id=43 ORDER BY option_order'
          ).fetchall()
          if len(opts) != 5:
              raise RuntimeError(f'Question 43 expected 5 options, found {len(opts)}')
          correct = [o for o in opts if o[1] == 1]
          if len(correct) != 1 or correct[0][0] != 'Smoking' or correct[0][2] != 4:
              raise RuntimeError(f'Question 43 correct option check failed: {correct}')

          if not Path('offline_media/43_stem_img_0.webp').is_file():
              raise RuntimeError('Question 43 CT image is missing')

          con.commit()
          integrity = cur.execute('PRAGMA integrity_check').fetchone()[0]
          if integrity != 'ok':
              raise RuntimeError(f'Integrity check failed: {integrity}')

          print('Integrity: ok')
          print('Question 43: verified')
          print('Correct option: E. Smoking')
          print('Image: offline_media/43_stem_img_0.webp')
          print('Questions:', cur.execute('SELECT COUNT(*) FROM questions').fetchone()[0])
          print('Options:', cur.execute('SELECT COUNT(*) FROM options').fetchone()[0])
          con.close()
          PY
      - name: Commit corrected database
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add my_course_bank.db
          git commit -m "Fix NBME question 43 media link"
          git push
